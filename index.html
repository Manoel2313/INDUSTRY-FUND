<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>INDUSTRY FUND - ZONA DE ANOMALIAS</title>
<style>
  :root{
    --gray-950:#0c0d0f;
    --gray-900:#141518;
    --gray-800:#202226;
    --gray-700:#33363b;
    --gray-500:#6b6f76;
    --gray-300:#a8acb3;
    --gray-100:#e4e6e9;
    --accent:#c8901f;
    --font-ui: 'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0c0d0f;font-family:var(--font-ui);}
  #renderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;outline:none;}

  #startScreen{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      linear-gradient(180deg, rgba(12,13,15,0.65), rgba(12,13,15,0.92)),
      repeating-linear-gradient(90deg, #17181b 0px, #17181b 2px, #121316 2px, #121316 64px);
    gap:48px;
  }
  #startTitle{
    font-family:var(--font-ui);
    font-weight:700;
    letter-spacing:14px;
    font-size:clamp(28px,6vw,58px);
    color:var(--gray-100);
    text-transform:uppercase;
    text-align:center;
    text-shadow:0 0 24px rgba(200,144,31,0.15), 0 2px 0 #000;
    border-top:2px solid var(--gray-700);
    border-bottom:2px solid var(--gray-700);
    padding:18px 26px;
  }
  #startSub{
    margin-top:-30px;
    color:var(--gray-500);
    letter-spacing:5px;
    font-size:11px;
    text-transform:uppercase;
  }
  #platformRow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  .platBtn{
    font-family:var(--font-ui);
    letter-spacing:4px;
    font-size:15px;
    padding:16px 40px;
    color:var(--gray-100);
    background:var(--gray-800);
    border:1px solid var(--gray-700);
    cursor:pointer;
    text-transform:uppercase;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .platBtn:hover{background:var(--gray-700);border-color:var(--accent);}
  .platBtn:active{transform:scale(0.97);}
  .platBtn.active{background:var(--accent);border-color:var(--accent);color:#111;}

  #loadingScreen{
    position:absolute;inset:0;z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--gray-950);
  }
  #loadingLabel{color:var(--gray-300);letter-spacing:5px;font-size:12px;text-transform:uppercase;}
  #loadingBarOuter{width:min(420px,70vw);height:6px;background:var(--gray-800);border:1px solid var(--gray-700);}
  #loadingBarInner{width:0%;height:100%;background:var(--accent);transition:width .12s linear;}

  #hud{
    position:absolute;top:14px;left:16px;z-index:20;
    color:var(--gray-100);font-family:var(--font-ui);font-size:13px;letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
    display:none;line-height:1.6;pointer-events:none;
  }
  #hud .lbl{color:var(--gray-500);}
  #hudPos{color:var(--accent);}
  #hudHealth{color:#ff4444;font-weight:bold;}
  #hudKills{color:#44ff88;}
  #hudLayer{color:var(--accent);}

  #crosshair{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:20px;height:20px;z-index:20;display:block;pointer-events:none;
  }
  #crosshair::before{
    content:'';position:absolute;top:50%;left:0;width:8px;height:2px;
    background:rgba(230,230,230,0.7);transform:translateY(-50%);
  }
  #crosshair::after{
    content:'';position:absolute;top:0;left:50%;width:2px;height:8px;
    background:rgba(230,230,230,0.7);transform:translateX(-50%);
  }
  #crosshair .dot{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:2px;height:2px;background:rgba(230,230,230,0.5);border-radius:50%;
  }
  #crosshair .ring{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:16px;height:16px;border:1px solid rgba(230,230,230,0.2);border-radius:50%;
  }

  #pcHint{
    position:absolute;bottom:14px;left:16px;z-index:20;color:var(--gray-500);
    font-family:var(--font-ui);font-size:11px;letter-spacing:1px;display:none;pointer-events:none;
  }

  #mobileControls{
    position:absolute;inset:0;z-index:20;
    display:none;
    pointer-events:none;
  }
  #mobileControls > * { pointer-events:auto; }

  #joystickZone{
    position:absolute;left:20px;bottom:20px;width:120px;height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);
    touch-action:none;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
  }
  #joystickKnob{
    position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
    border:2px solid rgba(255,255,255,0.2);
    pointer-events:none;
    box-shadow:0 0 20px rgba(255,255,255,0.05);
  }
  .mobileBtn{
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);
    color:var(--gray-100);
    font-family:var(--font-ui);
    font-size:10px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    transition:all 0.15s;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .mobileBtn:active{transform:scale(0.92);}
  .mobileBtn.active{background:var(--accent);border-color:var(--accent);color:#111;text-shadow:none;}

  #btnJump{
    position:absolute;right:20px;bottom:120px;width:72px;height:72px;
    font-size:11px;
    border-color:rgba(255,200,100,0.2);
  }
  #btnJump:active{background:rgba(255,200,100,0.15);}

  #btnRun{
    position:absolute;right:20px;bottom:20px;width:60px;height:60px;
    font-size:9px;
  }
  #btnRun.active{background:var(--accent);border-color:var(--accent);color:#111;}

  #btnShoot{
    position:absolute;right:100px;bottom:210px;width:72px;height:72px;
    font-size:11px;
    border-color:rgba(255,200,50,0.3);
    background:rgba(255,200,50,0.1);
  }
  #btnShoot:active{background:rgba(255,200,50,0.3);}

  #camLookZone{
    position:absolute;inset:0;
    touch-action:none;
    pointer-events:auto;
  }

  #blackScreen{
    position:absolute;inset:0;z-index:100;
    display:none;
    background:#000;
  }

  #toastMsg{
    position:absolute;top:110px;left:50%;transform:translateX(-50%);
    color:var(--gray-100);font-family:var(--font-ui);font-size:12px;letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);z-index:22;opacity:0;transition:opacity .3s;pointer-events:none;
  }
  
  #deathOverlay{
    position:absolute;inset:0;z-index:80;
    display:none;
    background:rgba(0,0,0,0.85);
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
  }
  #deathOverlay .title{
    color:#ff2222;
    font-size:clamp(32px,5vw,56px);
    font-family:var(--font-ui);
    letter-spacing:8px;
    text-shadow:0 0 60px rgba(255,0,0,0.3);
  }
  #deathOverlay .sub{
    color:var(--gray-500);
    font-size:14px;
    letter-spacing:3px;
    font-family:var(--font-ui);
  }
  #deathOverlay .btn-respawn{
    margin-top:20px;
    padding:12px 40px;
    background:var(--accent);
    border:1px solid var(--accent);
    color:#111;
    font-family:var(--font-ui);
    font-size:14px;
    letter-spacing:3px;
    cursor:pointer;
    text-transform:uppercase;
    border-radius:4px;
    transition:all .2s;
  }
  #deathOverlay .btn-respawn:hover{background:var(--gray-700);border-color:var(--gray-300);color:var(--gray-100);}
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="startScreen">
  <div>
    <div id="startTitle">Industry&nbsp;Fund</div>
    <div id="startSub">ZONA DE ANOMALIAS • SOBREVIVA</div>
  </div>
  <div id="platformRow">
    <button class="platBtn" id="btnPC">PC</button>
    <button class="platBtn" id="btnMobile">MOBILE</button>
  </div>
</div>

<div id="loadingScreen">
  <div id="loadingLabel">CARREGANDO 0%</div>
  <div id="loadingBarOuter"><div id="loadingBarInner"></div></div>
</div>

<div id="hud">
  <div><span class="lbl">❤️</span> <span id="hudHealth">100</span>%</div>
  <div><span class="lbl">💀</span> <span id="hudKills">0</span></div>
  <div><span class="lbl">📍</span> <span id="hudPos">0.0, 0.0, 0.0</span></div>
  <div><span class="lbl">🏢</span> Camada <span id="hudLayer">0</span></div>
</div>

<div id="crosshair">
  <div class="ring"></div>
  <div class="dot"></div>
</div>

<div id="pcHint">WASD mover · ESPAÇO pular · Q correr · Clique ESQUERDO atirar</div>

<div id="mobileControls">
  <div id="camLookZone"></div>
  <div id="joystickZone"><div id="joystickKnob"></div></div>
  <button class="mobileBtn" id="btnJump">⬆ PULAR</button>
  <button class="mobileBtn" id="btnRun">🏃 CORRER</button>
  <button class="mobileBtn" id="btnShoot">🔫 ATIRAR</button>
</div>

<div id="deathOverlay">
  <div class="title">💀 MORTO</div>
  <div class="sub">Você foi abatido por uma anomalia</div>
  <button class="btn-respawn" id="btnRespawn">▶ REAPARECER</button>
</div>

<div id="toastMsg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ======================================================================
   INDUSTRY FUND - PRIME v3 (Ogro Destruidor + IA Melhorada + Clima Vermelho)
   ====================================================================== */

/* ===== MENU ===== */
let selectedMode = null;

document.getElementById('btnPC').addEventListener('click', ()=>{
  selectedMode = 'pc';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});
document.getElementById('btnMobile').addEventListener('click', ()=>{
  selectedMode = 'mobile';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});

/* ---------------- CONFIG ---------------- */
let CHUNK_SIZE = 100;
let ACTIVE_RADIUS = 500;
let UNLOAD_MARGIN = 60;
let UNLOAD_RADIUS = ACTIVE_RADIUS + UNLOAD_MARGIN;
let INITIAL_RADIUS = 160;
let FADE_TIME = 1.1;

const WALK_SPEED   = 3;
const RUN_MULT     = 5;

const LAYER_HEIGHT  = 400;
const HOLE_RADIUS   = 14;
const HOLE_SPACING  = 400;
const HOLE_CHANCE   = 0.55;
const SHAFT_SALT    = 0x5A17;
const SHAFT_CLEAR   = HOLE_RADIUS + 6;
const STAIR_RADIUS  = 11;
const STEP_RISE     = 0.6;
const STEP_RUN      = 1.5;

const EYE_HEIGHT   = 1.7;
const PLAYER_RADIUS = 0.4;
const GRAVITY      = -24;
const JUMP_SPEED_NORMAL = Math.sqrt(2 * Math.abs(GRAVITY) * 2);
const JUMP_SPEED_RUN    = Math.sqrt(2 * Math.abs(GRAVITY) * 6);
const MAX_FALL_SPEED = 55;

// ===== JOGADOR =====
let playerHealth = 100;
let maxHealth = 100;
let kills = 0;
let isDead = false;
const SHOOT_COOLDOWN = 1.0;
let shootTimer = 0;
const BULLET_DAMAGE = 5;
const BULLET_RANGE = 80;

/* ===== CÂMERA (apenas primeira pessoa) ===== */
const canvas = document.getElementById('renderCanvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

// ===== CLIMA VERMELHO =====
const fogColor = new THREE.Color(0x3a0a0a);
const bgColor = new THREE.Color(0x1a0505);

const isMobile = window.innerWidth < 768;
const FOV = isMobile ? 65 : 72;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth/window.innerHeight, 0.1, 12000);
camera.rotation.order = 'YXZ';

const scene = new THREE.Scene();
scene.background = bgColor.clone();
scene.fog = new THREE.Fog(fogColor.clone(), 60, ACTIVE_RADIUS+80);

// Luzes com tom avermelhado
const ambientLight = new THREE.AmbientLight(0x883333, 0.5);
scene.add(ambientLight);
const hemisphereLight = new THREE.HemisphereLight(0x884444, 0x331111, 0.6);
scene.add(hemisphereLight);
const sunLight = new THREE.DirectionalLight(0xff8844, 0.8);
sunLight.position.set(180,260,120);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 500;
sunLight.shadow.camera.left = -160;
sunLight.shadow.camera.right = 160;
sunLight.shadow.camera.top = 160;
sunLight.shadow.camera.bottom = -160;
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x883333, 0.3);
fillLight.position.set(-160,120,-140);
scene.add(fillLight);

// Luz vermelha ambiente adicional
const redLight = new THREE.PointLight(0xff2222, 0.2, 200);
redLight.position.set(0, 100, 0);
scene.add(redLight);

function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w/h;
  camera.fov = (w < 768) ? 65 : 72;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

/* ===== PERSONAGEM ===== */
const playerGroup = new THREE.Group();
scene.add(playerGroup);

function createPlayer(){
  while(playerGroup.children.length > 0){
    const child = playerGroup.children[0];
    playerGroup.remove(child);
    child.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  }
  const dummy = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.1, 0.1),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  playerGroup.add(dummy);
  playerGroup.visible = true;
}

/* ===== PISTOLA VISÍVEL (FPS) ===== */
const gunGroup = new THREE.Group();
scene.add(gunGroup);

function createGun(){
  while(gunGroup.children.length > 0){
    const child = gunGroup.children[0];
    gunGroup.remove(child);
    child.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  }
  
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x666677, metalness: 0.8, roughness: 0.2 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.6, roughness: 0.4 });
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x2d1f0e, roughness: 0.9 });
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.9, roughness: 0.2 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, metalness: 0.5, roughness: 0.3 });
  
  // Corpo da pistola (mais detalhado)
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.32), metalMat);
  body.position.set(0, 0, -0.15);
  gunGroup.add(body);
  
  // Slide superior
  const slide = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.06, 0.28), darkMat);
  slide.position.set(0, 0.1, -0.14);
  gunGroup.add(slide);
  
  // Cano
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.22, 8), barrelMat);
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0, 0.02, -0.38);
  gunGroup.add(barrel);
  
  // Empunhadura
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.07), gripMat);
  grip.position.set(0, -0.08, -0.05);
  grip.rotation.x = 0.15;
  gunGroup.add(grip);
  
  // Textura da empunhadura (linhas)
  for(let i = 0; i < 3; i++){
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 0.01), new THREE.MeshStandardMaterial({ color: 0x4a3520 }));
    line.position.set(0, -0.04 - i*0.05, -0.06);
    gunGroup.add(line);
  }
  
  // Gatilho
  const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.04, 0.015), darkMat);
  trigger.position.set(0, -0.03, -0.10);
  gunGroup.add(trigger);
  
  // Guarda-mato
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.01, 0.04), darkMat);
  guard.position.set(0, -0.06, -0.09);
  gunGroup.add(guard);
  
  // Mira traseira
  const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.01), darkMat);
  rearSight.position.set(0, 0.14, -0.28);
  gunGroup.add(rearSight);
  
  // Mira frontal
  const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.025, 0.01), darkMat);
  frontSight.position.set(0, 0.135, -0.38);
  gunGroup.add(frontSight);
  
  // Detalhe decorativo
  const accent = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.015), accentMat);
  accent.position.set(0, 0.13, -0.20);
  gunGroup.add(accent);
  
  // Posição da pistola (canto inferior direito estilo FPS)
  gunGroup.position.set(0.35, -0.18, -0.6);
  gunGroup.rotation.x = -0.05;
  gunGroup.rotation.z = 0.1;
}

// Animação de recuo
let gunRecoil = 0;
let gunRecoilTime = 0;

function updateGun(dt){
  // Posição base
  const baseX = 0.35;
  const baseY = -0.18;
  const baseZ = -0.6;
  
  // Movimento de respiração
  const breath = Math.sin(performance.now() / 2000) * 0.002;
  
  // Recuo
  if(gunRecoil > 0){
    gunRecoilTime += dt;
    const progress = gunRecoilTime / 0.15;
    if(progress >= 1){
      gunRecoil = 0;
      gunRecoilTime = 0;
    } else {
      const ease = Math.sin(progress * Math.PI) * 0.025;
      gunGroup.position.x = baseX + ease * 0.5;
      gunGroup.position.y = baseY - ease * 0.8;
      gunGroup.position.z = baseZ + ease * 0.3;
      gunGroup.rotation.x = -0.05 - ease * 0.3;
      return;
    }
  }
  
  gunGroup.position.x = baseX + breath;
  gunGroup.position.y = baseY + Math.sin(performance.now() / 3000) * 0.002;
  gunGroup.position.z = baseZ;
  gunGroup.rotation.x = -0.05;
  gunGroup.rotation.z = 0.1 + Math.sin(performance.now() / 4000) * 0.002;
}

function triggerRecoil(){
  gunRecoil = 1;
  gunRecoilTime = 0;
}

/* ===== TOAST ===== */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.style.opacity = '1';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, 1800);
}

/* ===== ANOMALIAS ===== */
const monstersGroup = new THREE.Group();
scene.add(monstersGroup);
let monsters = [];

const MONSTER_TYPES = {
  CHUPA_CABRA: 'chupa_cabra',
  BAIACU: 'baiacu',
  ESPINHOSA: 'espinhosa',
  OGRO: 'ogro'
};

const MONSTER_DATA = {
  chupa_cabra: {
    hp: 100,
    damage: 30,
    speed: 3.5,
    points: 1,
    color: 0x8B4513,
    size: 1.0,
    attackRange: 2.5,
    attackCooldown: 1.5,
    baseScale: 0.6
  },
  baiacu: {
    hp: 75,
    damage: 30,
    speed: 3.0,
    points: 3,
    color: 0x44dd88,
    size: 0.8,
    attackRange: 2.0,
    attackCooldown: 1.2,
    explodeDamage: 50,
    explodeRadius: 8,
    flyHeight: 2.5,
    baseScale: 0.7
  },
  espinhosa: {
    hp: 100,
    damage: 25,
    speed: 5.0,
    points: 1,
    color: 0xcc8844,
    size: 1.2,
    attackRange: 20,
    attackCooldown: 1.8,
    projectileSpeed: 12,
    baseScale: 0.6
  },
  ogro: {
    hp: 250,
    damage: 70,
    speed: 1.8,
    points: 5,
    color: 0x44aa44,
    size: 2.5, // 50% menor (era 5.0)
    attackRange: 3.5,
    attackCooldown: 2.0,
    baseScale: 0.4,
    destroyRange: 2.0,
    destroyDamage: 50
  }
};

let monsterSpawnTimer = 0;
const MONSTER_SPAWN_INTERVAL = 2.0;
const MAX_MONSTERS = 30;

function createChupaCabra(){
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.8 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

function spawnMonster(nearPos){
  if(monsters.length >= MAX_MONSTERS) return;
  
  const types = Object.keys(MONSTER_TYPES);
  const typeKey = types[Math.floor(Math.random() * types.length)];
  const type = MONSTER_TYPES[typeKey];
  const data = MONSTER_DATA[type];
  
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 150;
  const x = nearPos.x + Math.cos(angle) * dist;
  const z = nearPos.z + Math.sin(angle) * dist;
  const layerY = Math.round(nearPos.y / LAYER_HEIGHT) * LAYER_HEIGHT;
  
  let mesh;
  switch(type){
    case 'chupa_cabra': mesh = createChupaCabra(); break;
    case 'baiacu': mesh = createBaiacu(); break;
    case 'espinhosa': mesh = createEspinhosa(); break;
    case 'ogro': mesh = createOgro(); break;
    default: mesh = createChupaCabra();
  }
  
  const scale = data.size * (0.8 + Math.random() * 0.4);
  mesh.scale.set(scale, scale, scale);
  mesh.position.set(x, layerY + 0.05, z);
  monstersGroup.add(mesh);
  
  const monster = {
    mesh,
    type,
    pos: new THREE.Vector3(x, layerY + 0.05, z),
    dir: new THREE.Vector3(0, 0, 1),
    hp: data.hp,
    maxHp: data.hp,
    damage: data.damage,
    speed: data.speed * (0.8 + Math.random() * 0.4),
    points: data.points,
    attackRange: data.attackRange,
    attackCooldown: 0,
    attackTimer: 0,
    state: 'idle',
    animTime: Math.random() * 100,
    flyHeight: data.flyHeight || 0,
    explodeDamage: data.explodeDamage || 0,
    explodeRadius: data.explodeRadius || 0,
    projectileSpeed: data.projectileSpeed || 0,
    destroyRange: data.destroyRange || 0,
    destroyDamage: data.destroyDamage || 0,
    stuckTimer: 0,
    stuckCheckPos: new THREE.Vector3(x, layerY, z),
    // IA melhorada
    stateTimer: 0,
    currentState: 'chase',
    lastKnownPos: nearPos.clone(),
    wanderTarget: new THREE.Vector3(x + (Math.random()-0.5)*20, layerY, z + (Math.random()-0.5)*20)
  };
  
  monsters.push(monster);
}

function createProjectile(origin, target, speed, damage){
  const mat = new THREE.MeshStandardMaterial({ 
    color: 0xcc8844, 
    emissive: 0xff6633, 
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.8
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), mat);
  mesh.position.copy(origin);
  scene.add(mesh);
  
  const dir = new THREE.Vector3().copy(target).sub(origin).normalize();
  
  return {
    mesh,
    pos: origin.clone(),
    dir,
    speed,
    damage,
    life: 10,
    active: true
  };
}

let projectiles = [];

function spawnProjectile(monster, playerPos){
  if(!monster.projectileSpeed) return;
  const origin = monster.pos.clone();
  origin.y += 1.5;
  const target = playerPos.clone();
  target.y += 0.5;
  const proj = createProjectile(origin, target, monster.projectileSpeed, monster.damage);
  projectiles.push(proj);
}

function updateProjectiles(dt){
  for(let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    p.pos.add(p.dir.clone().multiplyScalar(p.speed * dt));
    p.mesh.position.copy(p.pos);
    p.life -= dt;
    
    const distToPlayer = p.pos.distanceTo(player.position);
    if(distToPlayer < 0.8){
      takeDamage(p.damage);
      scene.remove(p.mesh);
      if(p.mesh.geometry) p.mesh.geometry.dispose();
      if(p.mesh.material) p.mesh.material.dispose();
      projectiles.splice(i, 1);
      continue;
    }
    
    if(p.life <= 0){
      scene.remove(p.mesh);
      if(p.mesh.geometry) p.mesh.geometry.dispose();
      if(p.mesh.material) p.mesh.material.dispose();
      projectiles.splice(i, 1);
    }
  }
}

function destroyStructureAt(pos, radius){
  // Remove estruturas do chunk próximas ao ogro
  for(const [key, c] of chunkMap){
    const centerX = c.cx * CHUNK_SIZE + CHUNK_SIZE/2;
    const centerZ = c.cz * CHUNK_SIZE + CHUNK_SIZE/2;
    const dist = Math.hypot(centerX - pos.x, centerZ - pos.z);
    if(dist < radius + CHUNK_SIZE/2){
      // Recria o chunk sem as estruturas (apenas chão e shafts)
      // Por simplicidade, vamos marcar o chunk para recriar
      const boxes = generateChunkBoxes(c.cx, c.cz, c.layer, 0, false);
      // Recria o mesh
      const newMesh = buildChunkMesh(boxes);
      chunkGroup.remove(c.mesh);
      c.mesh.geometry.dispose();
      c.mesh.material.dispose();
      chunkGroup.add(newMesh);
      c.mesh = newMesh;
      c.alpha = 1;
      c.mesh.material.opacity = 1;
      c.mesh.scale.y = 1;
      rebuildCollidables();
    }
  }
}

function updateMonsters(dt, playerPos){
  if(isDead) return;
  
  monsterSpawnTimer -= dt;
  if(monsterSpawnTimer <= 0){
    monsterSpawnTimer = MONSTER_SPAWN_INTERVAL;
    spawnMonster(playerPos);
  }
  
  for(let i = monsters.length - 1; i >= 0; i--){
    const m = monsters[i];
    const d = m.pos.distanceTo(playerPos);
    if(d > 300){
      monstersGroup.remove(m.mesh);
      m.mesh.traverse(o=>{
        if(o.geometry) o.geometry.dispose();
        if(o.material){ if(Array.isArray(o.material)) o.material.forEach(mm=>mm.dispose()); else o.material.dispose(); }
      });
      monsters.splice(i, 1);
    }
  }
  
  for(const m of monsters){
    const dx = playerPos.x - m.pos.x;
    const dz = playerPos.z - m.pos.z;
    const distToPlayer = Math.hypot(dx, dz);
    
    m.animTime += dt * m.speed;
    m.stateTimer += dt;
    
    if(m.hp <= 0){
      if(m.type === 'baiacu' && m.explodeDamage > 0){
        const explodeDist = m.pos.distanceTo(playerPos);
        if(explodeDist < m.explodeRadius){
          takeDamage(Math.round(m.explodeDamage * (1 - explodeDist / m.explodeRadius)));
        }
        showToast('💥 BAIACU EXPLODIU!');
      }
      
      monstersGroup.remove(m.mesh);
      m.mesh.traverse(o=>{
        if(o.geometry) o.geometry.dispose();
        if(o.material){ if(Array.isArray(o.material)) o.material.forEach(mm=>mm.dispose()); else o.material.dispose(); }
      });
      kills += m.points;
      document.getElementById('hudKills').textContent = kills;
      showToast('+' + m.points + ' ponto' + (m.points > 1 ? 's' : ''));
      monsters.splice(monsters.indexOf(m), 1);
      continue;
    }
    
    // ===== IA MELHORADA =====
    if(m.type === 'baiacu'){
      m.pos.y = Math.round(playerPos.y / LAYER_HEIGHT) * LAYER_HEIGHT + m.flyHeight + Math.sin(m.animTime * 0.5) * 0.5;
    }
    
    // OGRO - DESTRÓI ESTRUTURAS
    if(m.type === 'ogro' && m.destroyRange > 0){
      // Verifica se está perto de estruturas
      let hitStructure = false;
      for(const [key, c] of chunkMap){
        const centerX = c.cx * CHUNK_SIZE + CHUNK_SIZE/2;
        const centerZ = c.cz * CHUNK_SIZE + CHUNK_SIZE/2;
        const dist = Math.hypot(centerX - m.pos.x, centerZ - m.pos.z);
        if(dist < m.destroyRange + 5){
          hitStructure = true;
          break;
        }
      }
      if(hitStructure && m.stateTimer > 0.5){
        destroyStructureAt(m.pos, m.destroyRange);
        m.stateTimer = 0;
        showToast('💥 OGRO DESTRUIU ESTRUTURAS!');
      }
    }
    
    if(distToPlayer < 200){
      const desired = new THREE.Vector3(dx, 0, dz).normalize();
      
      // Estados da IA
      if(m.type === 'espinhosa' && distToPlayer < 50 && distToPlayer > 5){
        m.attackTimer -= dt;
        if(m.attackTimer <= 0){
          spawnProjectile(m, playerPos);
          m.attackTimer = 1.8;
        }
        // Espinhosa fica mais parada quando atira
        if(distToPlayer > 15){
          m.pos.x += desired.x * m.speed * dt * 0.3;
          m.pos.z += desired.z * m.speed * dt * 0.3;
        }
      } else if(distToPlayer < m.attackRange){
        m.attackTimer -= dt;
        if(m.attackTimer <= 0){
          takeDamage(m.damage);
          m.attackTimer = 2.0;
          showToast('💢 ' + m.type + ' te atacou!');
        }
        // Recua um pouco
        m.pos.x -= desired.x * m.speed * dt * 0.3;
        m.pos.z -= desired.z * m.speed * dt * 0.3;
      } else {
        // Persegue o jogador
        const moveSpeed = m.speed * (m.type === 'ogro' ? 0.5 : 1);
        m.pos.x += desired.x * moveSpeed * dt;
        m.pos.z += desired.z * moveSpeed * dt;
      }
      
      m.dir.copy(desired);
      m.mesh.rotation.y = Math.atan2(desired.x, desired.z);
    }
    
    m.mesh.position.copy(m.pos);
    
    if(m.type === 'baiacu'){
      m.mesh.position.y += Math.sin(m.animTime * 2) * 0.1;
      m.mesh.rotation.z = Math.sin(m.animTime * 1.5) * 0.1;
    }
    
    if(m.type === 'ogro'){
      m.mesh.rotation.z = Math.sin(m.animTime * 0.5) * 0.05;
    }
  }
}

/* ===== SISTEMA DE DANO ===== */
function takeDamage(amount){
  if(isDead) return;
  playerHealth = Math.max(0, playerHealth - amount);
  document.getElementById('hudHealth').textContent = Math.round(playerHealth);
  
  if(playerHealth <= 0){
    playerHealth = 0;
    isDead = true;
    document.getElementById('deathOverlay').style.display = 'flex';
    document.getElementById('crosshair').style.display = 'none';
  }
}

function respawn(){
  playerHealth = maxHealth;
  isDead = false;
  document.getElementById('hudHealth').textContent = playerHealth;
  document.getElementById('deathOverlay').style.display = 'none';
  document.getElementById('crosshair').style.display = 'block';
  
  player.position.set(0, EYE_HEIGHT, 0);
  velocityY = 0;
  grounded = true;
  yaw = 0;
  pitch = 0;
  camera.position.copy(player.position);
}

document.getElementById('btnRespawn').addEventListener('click', respawn);

/* ===== TIRO ===== */
function shoot(){
  if(isDead) return;
  if(shootTimer > 0) return;
  shootTimer = SHOOT_COOLDOWN;
  
  triggerRecoil();
  
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(camera.position, dir);
  raycaster.far = BULLET_RANGE;
  
  const monsterMeshes = [];
  for(const m of monsters){
    m.mesh.traverse(child => {
      if(child.isMesh){
        monsterMeshes.push(child);
      }
    });
  }
  
  const hits = raycaster.intersectObjects(monsterMeshes, false);
  let hitMonster = null;
  
  if(hits.length > 0){
    let obj = hits[0].object;
    while(obj.parent && !monsters.some(m => m.mesh === obj)){
      obj = obj.parent;
    }
    for(const m of monsters){
      if(m.mesh === obj || m.mesh.children.includes(obj) || obj === m.mesh){
        hitMonster = m;
        break;
      }
    }
  }
  
  if(hitMonster){
    hitMonster.hp -= BULLET_DAMAGE;
    showToast('💥 +5 de dano!');
  }
  
  createMuzzleFlash();
}

function createMuzzleFlash(){
  const flash = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xffff44, transparent: true, opacity: 0.8 })
  );
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  flash.position.copy(camera.position).add(dir.multiplyScalar(0.5));
  scene.add(flash);
  setTimeout(() => {
    scene.remove(flash);
    if(flash.geometry) flash.geometry.dispose();
    if(flash.material) flash.material.dispose();
  }, 50);
}

/* ===== GEOMETRIA ===== */
const UNIT_BOX = new THREE.BoxGeometry(1,1,1).toNonIndexed();
const BASE_POS = UNIT_BOX.attributes.position.array;
const BASE_NORM = UNIT_BOX.attributes.normal.array;
const VERTS_PER_BOX = BASE_POS.length/3;
function box(x,y,z,w,h,d,color,isGround){ return {x,y,z,w,h,d,color,ground:!!isGround}; }

function hashSeed(cx,cz,cy,salt){
  let h = 2166136261;
  h = Math.imul(h ^ (cx|0), 16777619);
  h = Math.imul(h ^ (cz|0), 16777619);
  h = Math.imul(h ^ (cy|0), 16777619);
  h = Math.imul(h ^ (salt|0), 16777619);
  h = Math.imul(h ^ 0x9e3779b9, 16777619);
  return h>>>0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

function grayColor(rng, lo, hi, tint){
  const l = lo + rng()*(hi-lo);
  const hue = tint===undefined ? 0.58 + (rng()-0.5)*0.07 : tint;
  const sat = 0.03 + rng()*0.06;
  const c = new THREE.Color(); c.setHSL(hue, sat, l); return c;
}
function groundColor(rng){ const c = grayColor(rng, 0.04, 0.10); return c; }
function structColor(rng){ const c = grayColor(rng, 0.12, 0.38); if(rng()<0.22) return grimeColor(rng); return c; }
function grimeColor(rng){
  const c = new THREE.Color();
  const pick = rng();
  if(pick<0.4){ c.setHSL(0.08+rng()*0.04, 0.4+rng()*0.15, 0.16+rng()*0.14); }
  else if(pick<0.7){ c.setHSL(0.24+rng()*0.05, 0.2+rng()*0.15, 0.10+rng()*0.10); }
  else { c.setHSL(0.0, 0.0, 0.05+rng()*0.06); }
  return c;
}

/* ---------------- CHUNK ---------------- */
function shaftForChunk(cx, cz, layer){
  if(cx===0 && cz===0 && layer===0) return null;
  const per = Math.max(1, Math.round(HOLE_SPACING/CHUNK_SIZE));
  const rng = mulberry32(hashSeed(Math.floor(cx/per), Math.floor(cz/per), layer, SHAFT_SALT));
  if(rng() >= HOLE_CHANCE) return null;
  const pickX = Math.floor(rng()*per), pickZ = Math.floor(rng()*per);
  if((((cx%per)+per)%per) !== pickX) return null;
  if((((cz%per)+per)%per) !== pickZ) return null;
  const span = Math.max(0, CHUNK_SIZE - (HOLE_RADIUS+8)*2);
  return { x: cx*CHUNK_SIZE + CHUNK_SIZE/2 + (rng()-0.5)*span, z: cz*CHUNK_SIZE + CHUNK_SIZE/2 + (rng()-0.5)*span };
}

function genGround(boxes, ox, oz, layerY, color, hole){
  const y = layerY - 0.5;
  if(!hole){ boxes.push(box(ox+CHUNK_SIZE/2, y, oz+CHUNK_SIZE/2, CHUNK_SIZE, 1, CHUNK_SIZE, color, true)); return; }
  const x0=ox, x1=ox+CHUNK_SIZE, z0=oz, z1=oz+CHUNK_SIZE;
  const hx0=Math.max(x0, hole.x-HOLE_RADIUS), hx1=Math.min(x1, hole.x+HOLE_RADIUS);
  const hz0=Math.max(z0, hole.z-HOLE_RADIUS), hz1=Math.min(z1, hole.z+HOLE_RADIUS);
  const slab=(ax,az,bx,bz)=>{ const w=bx-ax, d=bz-az; if(w<=0.01||d<=0.01) return; boxes.push(box(ax+w/2, y, az+d/2, w, 1, d, color, true)); };
  slab(x0,z0,hx0,z1); slab(hx1,z0,x1,z1); slab(hx0,z0,hx1,hz0); slab(hx0,hz1,hx1,z1);
}

function outsideShaft(b, hole, radius){ if(!hole) return true; if(b.x+b.w/2 <= hole.x-radius || b.x-b.w/2 >= hole.x+radius) return true; if(b.z+b.d/2 <= hole.z-radius || b.z-b.d/2 >= hole.z+radius) return true; return false; }

function genShaft(boxes, hole, layerY, rng){
  const r=HOLE_RADIUS, bottomY=layerY-LAYER_HEIGHT;
  const frameColor=new THREE.Color(0xff2200), stairColor=structColor(rng), markColor=new THREE.Color(0xff8800), steelColor=new THREE.Color(0x4a4f57);
  for(let i=0;i<28;i++){ const t=(i/28)*4; const side=Math.floor(t), f=(t-side)*2-1; const px=side===0?hole.x+f*r:side===1?hole.x+r:side===2?hole.x-f*r:hole.x-r; const pz=side===0?hole.z-r:side===1?hole.z+f*r:side===2?hole.z+r:hole.z-f*r; boxes.push(box(px, layerY+0.15, pz, 3.4,0.3,3.4, i%2?frameColor:markColor)); }
  const h=LAYER_HEIGHT, cy=bottomY+h/2;
  for(const sx of [-1,1]) for(const sz of [-1,1]){ boxes.push(box(hole.x+sx*(r+1.5), cy, hole.z+sz*(r+1.5), 2.4,h,2.4, steelColor)); }
  boxes.push(box(hole.x, cy, hole.z, 2.6,h,2.6, steelColor));
  for(let y=bottomY+40; y<layerY-10; y+=50){ boxes.push(box(hole.x,y,hole.z-(r+1.5),(r+1.5)*2,1.2,1.2,steelColor)); boxes.push(box(hole.x,y,hole.z+(r+1.5),(r+1.5)*2,1.2,1.2,steelColor)); boxes.push(box(hole.x-(r+1.5),y,hole.z,1.2,1.2,(r+1.5)*2,steelColor)); boxes.push(box(hole.x+(r+1.5),y,hole.z,1.2,1.2,(r+1.5)*2,steelColor)); }
  const walkLen=r-9; boxes.push(box(hole.x+9+walkLen/2, layerY-0.2, hole.z, walkLen,0.4,4.2, stairColor));
  const steps=Math.round(LAYER_HEIGHT/STEP_RISE); const angStep=STEP_RUN/STAIR_RADIUS;
  for(let i=1;i<=steps;i++){ const a=-i*angStep; const y=layerY-i*STEP_RISE; boxes.push(box(hole.x+Math.cos(a)*STAIR_RADIUS, y-0.2, hole.z+Math.sin(a)*STAIR_RADIUS, 4,0.4,4, i%24===0?markColor:stairColor)); }
  for(let y=bottomY+20; y<layerY; y+=35){ boxes.push(box(hole.x+r-1, y, hole.z, 1.2,1.2,1.2, new THREE.Color(0xff4400))); boxes.push(box(hole.x-r+1, y+17, hole.z, 1.2,1.2,1.2, new THREE.Color(0xff4400))); }
}

function genBuildings(boxes, ox, oz, layerY, rng, density){
  const count = density*8 + Math.floor(rng()*(density*8+4));
  for(let i=0;i<count;i++){
    const w=3+rng()*20, d=3+rng()*20, h=4+rng()*55;
    const x=ox-8+rng()*(CHUNK_SIZE+16-w), z=oz-8+rng()*(CHUNK_SIZE+16-d);
    boxes.push(box(x+w/2, layerY+h/2, z+d/2, w,h,d, structColor(rng)));
    if(rng()<0.6){ boxes.push(box(x+w/2, layerY+h+3, z+d/2, w*(0.2+rng()*0.5), 2+rng()*8, d*(0.2+rng()*0.5), grimeColor(rng))); }
    if(rng()<0.5){ boxes.push(box(x+w/2, layerY+h*(0.2+rng()*0.6), z+d/2+d*0.4, w*0.6, 0.7, 1.2, grimeColor(rng))); }
    if(rng()<0.4){ boxes.push(box(x+w/2+(rng()-0.5)*w*0.7, layerY+h*(0.1+rng()*0.7), z+d/2+(rng()-0.5)*d*0.7, 2+rng()*6, 2+rng()*10, 2+rng()*6, grimeColor(rng))); }
    if(rng()<0.3){ boxes.push(box(x+w/2+w*0.3, layerY+h*0.7, z+d/2+d*0.3, w*0.4, h*1.2, d*0.4, structColor(rng))); }
  }
}

function genMegastructure(boxes, ox, oz, layerY, rng){
  const w=15+rng()*35, d=15+rng()*35, h=60+rng()*220;
  const x=ox+CHUNK_SIZE*(0.2+rng()*0.5), z=oz+CHUNK_SIZE*(0.2+rng()*0.5);
  boxes.push(box(x, layerY+h/2, z, w,h,d, structColor(rng)));
  const beams=6+Math.floor(rng()*10);
  for(let i=0;i<beams;i++){ const by=layerY+8+(h-20)*(i/(beams-1||1)); boxes.push(box(x, by, z, w+6+rng()*14, 1.2+rng()*3, d+6+rng()*14, grimeColor(rng))); }
  if(rng()<0.5){ for(let i=0;i<4;i++){ const angle=(i/4)*Math.PI*2; const px=x+Math.cos(angle)*w*0.6; const pz=z+Math.sin(angle)*d*0.6; boxes.push(box(px, layerY+h*0.3, pz, 3+rng()*8, 5+rng()*15, 3+rng()*8, grimeColor(rng))); } }
}

function genBridge(boxes, ox, oz, layerY, rng){
  const alongX=rng()<0.5; const y=layerY+4+rng()*55; const thickness=1.5+rng()*3.5, width=4+rng()*10; const lateral=ox_lateral(ox,oz,alongX,rng);
  if(alongX){ boxes.push(box(ox+CHUNK_SIZE/2, y, lateral, CHUNK_SIZE*1.3, thickness, width, structColor(rng))); for(let i=0;i<6;i++){ const px=ox+5+i*(CHUNK_SIZE-10)/5; boxes.push(box(px, layerY+Math.max(1,(y-layerY)/2), lateral, 2.5, Math.max(2,(y-layerY)), 2.5, structColor(rng))); } }
  else { boxes.push(box(lateral, y, oz+CHUNK_SIZE/2, width, thickness, CHUNK_SIZE*1.3, structColor(rng))); for(let i=0;i<6;i++){ const pz=oz+5+i*(CHUNK_SIZE-10)/5; boxes.push(box(lateral, layerY+Math.max(1,(y-layerY)/2), pz, 2.5, Math.max(2,(y-layerY)), 2.5, structColor(rng))); } }
}
function ox_lateral(ox, oz, alongX, rng){ return alongX ? (oz+10+rng()*(CHUNK_SIZE-20)) : (ox+10+rng()*(CHUNK_SIZE-20)); }

function genTunnel(boxes, ox, oz, layerY, rng){
  const alongX=rng()<0.5; const h=5+rng()*8, w=5+rng()*10, wallT=1.5; const jx=(rng()-0.5)*40, jz=(rng()-0.5)*40; const cx=ox+CHUNK_SIZE/2+jx, cz=oz+CHUNK_SIZE/2+jz;
  if(alongX){ boxes.push(box(cx, layerY+h/2, cz-w/2, CHUNK_SIZE*1.2, h, wallT, structColor(rng))); boxes.push(box(cx, layerY+h/2, cz+w/2, CHUNK_SIZE*1.2, h, wallT, structColor(rng))); boxes.push(box(cx, layerY+h, cz, CHUNK_SIZE*1.2, wallT, w, structColor(rng))); }
  else { boxes.push(box(cx-w/2, layerY+h/2, cz, wallT, h, CHUNK_SIZE*1.2, structColor(rng))); boxes.push(box(cx+w/2, layerY+h/2, cz, wallT, h, CHUNK_SIZE*1.2, structColor(rng))); boxes.push(box(cx, layerY+h, cz, w, wallT, CHUNK_SIZE*1.2, structColor(rng))); }
  if(rng()<0.4){ const h2=4+rng()*6, w2=4+rng()*8; boxes.push(box(cx+10, layerY+h2/2, cz-w2/2, 5, h2, wallT, grimeColor(rng))); boxes.push(box(cx+10, layerY+h2/2, cz+w2/2, 5, h2, wallT, grimeColor(rng))); }
}

function genWall(boxes, ox, oz, layerY, rng){
  const alongX=rng()<0.5; const h=10+rng()*55, len=CHUNK_SIZE*(0.4+rng()*0.35), thickness=1.5+rng()*4; const offsetFrac=rng()*0.4, lateralFrac=rng()*0.6;
  if(alongX){ boxes.push(box(ox+CHUNK_SIZE*offsetFrac+len/2, layerY+h/2, oz+CHUNK_SIZE*lateralFrac, len, h, thickness, structColor(rng))); if(rng()<0.5){ boxes.push(box(ox+CHUNK_SIZE*offsetFrac+len/2, layerY+h/2, oz+CHUNK_SIZE*lateralFrac+5, len, h*0.6, thickness*0.7, grimeColor(rng))); } }
  else { boxes.push(box(ox+CHUNK_SIZE*lateralFrac, layerY+h/2, oz+CHUNK_SIZE*offsetFrac+len/2, thickness, h, len, structColor(rng))); if(rng()<0.5){ boxes.push(box(ox+CHUNK_SIZE*lateralFrac+5, layerY+h/2, oz+CHUNK_SIZE*offsetFrac+len/2, thickness*0.7, h*0.6, len, grimeColor(rng))); } }
}

function genPillarfield(boxes, ox, oz, layerY, rng){
  const gridN=4+Math.floor(rng()*4), spacing=7+rng()*7; const cx=ox+CHUNK_SIZE*(0.1+rng()*0.6)-(gridN*spacing)/2; const cz=oz+CHUNK_SIZE*(0.1+rng()*0.6)-(gridN*spacing)/2;
  for(let i=0;i<gridN;i++){ for(let j=0;j<gridN;j++){ const h=8+rng()*70, pR=0.8+rng()*1.8, jitterX=(rng()-0.5)*6, jitterZ=(rng()-0.5)*6; boxes.push(box(cx+i*spacing+jitterX, layerY+h/2, cz+j*spacing+jitterZ, pR, h, pR, structColor(rng))); if(rng()<0.3){ boxes.push(box(cx+i*spacing+jitterX, layerY+h*0.7, cz+j*spacing+jitterZ, pR*3, 0.8, pR*3, grimeColor(rng))); } } }
  if(rng()<0.7){ const platY=layerY+6+rng()*55; boxes.push(box(cx+(gridN*spacing)/2, platY, cz+(gridN*spacing)/2, gridN*spacing+12, 1.2+rng()*3, gridN*spacing+12, structColor(rng))); }
}

function genClutterAndPiercers(boxes, ox, oz, layerY, rng, count){
  const clutterCount=Math.round(count*4);
  for(let i=0;i<clutterCount;i++){ const s=0.5+rng()*5; const x=ox+rng()*CHUNK_SIZE, z=oz+rng()*CHUNK_SIZE; const y=layerY+rng()*rng()*55; boxes.push(box(x, y+s/2, z, s*(0.3+rng()), s*(0.3+rng()*3), s*(0.3+rng()), grimeColor(rng))); }
  const piercers=2+Math.floor(rng()*4);
  for(let i=0;i<piercers;i++){ const alongX=rng()<0.5; const y=layerY+0.5+rng()*70; const thickness=0.8+rng()*3.5, width=1.5+rng()*9, pos=rng()*CHUNK_SIZE; if(alongX){ boxes.push(box(ox+CHUNK_SIZE/2, y, oz+pos, CHUNK_SIZE*1.3, thickness, width, grimeColor(rng))); } else { boxes.push(box(ox+pos, y, oz+CHUNK_SIZE/2, width, thickness, CHUNK_SIZE*1.3, grimeColor(rng))); } }
}

function generateChunkBoxes(cx, cz, layerIndex, salt, isSpawn){
  const rng = mulberry32(hashSeed(cx, cz, layerIndex, salt));
  const ox = cx*CHUNK_SIZE, oz = cz*CHUNK_SIZE;
  const layerY = layerIndex * LAYER_HEIGHT;
  const holeHere = shaftForChunk(cx, cz, layerIndex);
  const holeAbove = shaftForChunk(cx, cz, layerIndex + 1);
  const boxes = [];
  genGround(boxes, ox, oz, layerY, groundColor(rng), holeHere);

  let structs = [];
  if(isSpawn && layerIndex === 0){
    genBuildings(structs, ox, oz, layerY, rng, 2);
    genPillarfield(structs, ox, oz, layerY, rng);
    genClutterAndPiercers(structs, ox, oz, layerY, rng, 5);
    genTunnel(structs, ox, oz, layerY, rng);
    if(rng()<0.45) genWall(structs, ox, oz, layerY, rng);
    if(rng()<0.6) genBridge(structs, ox, oz, layerY, rng);
  } else {
    genBuildings(structs, ox, oz, layerY, rng, 4);
    genPillarfield(structs, ox, oz, layerY, rng);
    genTunnel(structs, ox, oz, layerY, rng);
    if(rng()<0.55) genTunnel(structs, ox, oz, layerY, rng);
    genBridge(structs, ox, oz, layerY, rng);
    if(rng()<0.55) genBridge(structs, ox, oz, layerY, rng);
    if(rng()<0.3) genMegastructure(structs, ox, oz, layerY, rng);
    genClutterAndPiercers(structs, ox, oz, layerY, rng, 8);
    if(rng()<0.45) genWall(structs, ox, oz, layerY, rng);
    if(rng()<0.25) genWall(structs, ox, oz, layerY, rng);
  }
  if(holeHere || holeAbove){ structs = structs.filter(b => outsideShaft(b, holeHere, SHAFT_CLEAR) && outsideShaft(b, holeAbove, SHAFT_CLEAR)); }
  for(let i=0;i<structs.length;i++) boxes.push(structs[i]);
  if(holeHere) genShaft(boxes, holeHere, layerY, rng);
  return boxes;
}

function buildChunkMesh(boxes){
  const n = boxes.length;
  const positions = new Float32Array(n*VERTS_PER_BOX*3);
  const normals = new Float32Array(n*VERTS_PER_BOX*3);
  const colors = new Float32Array(n*VERTS_PER_BOX*3);
  let vOff = 0;
  for(let bi=0; bi<n; bi++){
    const b = boxes[bi];
    for(let i=0;i<VERTS_PER_BOX;i++){
      const lx = BASE_POS[i*3], ly = BASE_POS[i*3+1], lz = BASE_POS[i*3+2];
      const idx = (vOff+i)*3;
      positions[idx] = b.x + lx*b.w;
      positions[idx+1] = b.y + ly*b.h;
      positions[idx+2] = b.z + lz*b.d;
      normals[idx] = BASE_NORM[i*3];
      normals[idx+1] = BASE_NORM[i*3+1];
      normals[idx+2] = BASE_NORM[i*3+2];
      colors[idx] = b.color.r;
      colors[idx+1] = b.color.g;
      colors[idx+2] = b.color.b;
    }
    vOff += VERTS_PER_BOX;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.88, metalness:0.35, transparent:true, opacity:0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = true;
  mesh.userData.boxes = boxes;
  mesh.userData.destroyed = new Set();
  return mesh;
}

/* ---------------- STREAMING ---------------- */
const chunkGroup = new THREE.Group();
scene.add(chunkGroup);
const chunkMap = new Map();
const saltMap = new Map();
const buildingSet = new Set();

let collidablesList = [];
function rebuildCollidables(){ collidablesList = chunkGroup.children; }

function chunkKey(cx, cz, layer){ return cx+','+cz+','+layer; }
function getLayerFromY(y){ return Math.round(y/LAYER_HEIGHT); }

function requestChunk(cx, cz, layer){
  const key = chunkKey(cx,cz,layer);
  if(chunkMap.has(key) || buildingSet.has(key)) return;
  buildingSet.add(key);
  const salt = saltMap.get(key) || 0;
  const isSpawn = (cx===0 && cz===0 && layer===0);
  const boxes = generateChunkBoxes(cx, cz, layer, salt, isSpawn);
  const mesh = buildChunkMesh(boxes);
  chunkGroup.add(mesh);
  chunkMap.set(key, {cx,cz,layer,mesh,state:'in',alpha:0,scaleY:0.15});
  buildingSet.delete(key);
  rebuildCollidables();
}

function unloadChunk(key){
  const c = chunkMap.get(key);
  if(!c) return;
  chunkGroup.remove(c.mesh);
  c.mesh.geometry.dispose();
  c.mesh.material.dispose();
  chunkMap.delete(key);
  saltMap.set(key, (saltMap.get(key)||0)+1);
  rebuildCollidables();
}

let loadingComplete = false;

function nearestMissingChunks(px, py, pz, radius, forwardX, forwardZ){
  const currentLayer = getLayerFromY(py);
  const layerRange = Math.ceil(radius/LAYER_HEIGHT)+1;
  const rC = Math.ceil(radius/CHUNK_SIZE);
  const pcx = Math.floor(px/CHUNK_SIZE), pcz = Math.floor(pz/CHUNK_SIZE);
  const list = [];
  for(let layer=currentLayer-layerRange; layer<=currentLayer+layerRange; layer++){
    const layerY = layer*LAYER_HEIGHT;
    const dy = layerY - py;
    if(Math.abs(dy) > radius + LAYER_HEIGHT) continue;
    for(let cx=pcx-rC; cx<=pcx+rC; cx++){
      for(let cz=pcz-rC; cz<=pcz+rC; cz++){
        const centerX = cx*CHUNK_SIZE+CHUNK_SIZE/2, centerZ = cz*CHUNK_SIZE+CHUNK_SIZE/2;
        const dx = centerX-px, dz = centerZ-pz;
        const dist = Math.hypot(dx,dy,dz);
        if(dist>radius) continue;
        const key = chunkKey(cx,cz,layer);
        if(chunkMap.has(key) || buildingSet.has(key)) continue;
        let score = dist;
        if(forwardX!==undefined && dist>0.01){ const dot = (dx/dist)*forwardX + (dz/dist)*forwardZ; score -= dot*40; }
        list.push({cx,cz,layer,score});
      }
    }
  }
  list.sort((a,b)=>a.score-b.score);
  return list;
}

function updateStreaming(px, py, pz, forwardX, forwardZ, budget){
  const candidates = nearestMissingChunks(px, py, pz, ACTIVE_RADIUS, forwardX, forwardZ);
  for(let i=0;i<Math.min(budget, candidates.length); i++){ requestChunk(candidates[i].cx, candidates[i].cz, candidates[i].layer); }
  for(const [key,c] of chunkMap){
    const centerX = c.cx*CHUNK_SIZE+CHUNK_SIZE/2, centerZ = c.cz*CHUNK_SIZE+CHUNK_SIZE/2;
    const layerY = c.layer*LAYER_HEIGHT;
    const dy = layerY - py;
    const dist = Math.hypot(centerX-px, centerZ-pz, dy);
    if(dist>UNLOAD_RADIUS && c.state!=='out'){ c.state='out'; }
    else if(dist<=ACTIVE_RADIUS && c.state==='out'){ c.state='in'; }
  }
}

function animateChunks(dt){
  for(const [key,c] of chunkMap){
    if(c.state==='in'){ c.alpha = Math.min(1, c.alpha+dt/FADE_TIME); c.mesh.scale.y = 0.15+0.85*c.alpha; c.mesh.material.opacity = c.alpha; if(c.alpha>=1) c.state='active'; }
    else if(c.state==='out'){ c.alpha = Math.max(0, c.alpha-dt/FADE_TIME); c.mesh.scale.y = 0.15+0.85*c.alpha; c.mesh.material.opacity = c.alpha; if(c.alpha<=0) unloadChunk(key); }
  }
}

/* ===== PLAYER ===== */
const player = { position: new THREE.Vector3(0, EYE_HEIGHT, 0) };
let yaw = 0, pitch = 0;
let velocityY = 0;
let grounded = true;
let running = false;
let wantsJump = false;
let fallStartY = null;

const raycaster = new THREE.Raycaster();
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();

function updateFirstPersonCamera(){
  camera.position.copy(player.position);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

function updatePhysics(dt, inForward, inStrafe){
  if(isDead) return;
  
  const speed = WALK_SPEED * (running ? RUN_MULT : 1);
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _right.set(Math.cos(yaw), 0, -Math.sin(yaw));

  let mx = _fwd.x*inForward + _right.x*inStrafe;
  let mz = _fwd.z*inForward + _right.z*inStrafe;
  const len = Math.hypot(mx,mz);
  if(len>1){ mx/=len; mz/=len; }

  let dx = mx*speed*dt;
  let dz = mz*speed*dt;
  const rayY = (player.position.y - EYE_HEIGHT) + 0.9;

  if(Math.abs(dx) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(Math.sign(dx),0,0));
    raycaster.far = PLAYER_RADIUS + Math.abs(dx) + 0.05;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length>0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dx = Math.sign(dx)*Math.min(Math.abs(dx), allowed);
    }
  }
  player.position.x += dx;

  if(Math.abs(dz) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(0,0,Math.sign(dz)));
    raycaster.far = PLAYER_RADIUS + Math.abs(dz) + 0.05;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length>0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dz = Math.sign(dz)*Math.min(Math.abs(dz), allowed);
    }
  }
  player.position.z += dz;

  velocityY += GRAVITY*dt;
  if(velocityY < -MAX_FALL_SPEED) velocityY = -MAX_FALL_SPEED;
  if(wantsJump && grounded){
    velocityY = running ? JUMP_SPEED_RUN : JUMP_SPEED_NORMAL;
    grounded = false;
  }
  wantsJump = false;
  player.position.y += velocityY*dt;

  const downOrigin = new THREE.Vector3(player.position.x, (player.position.y-EYE_HEIGHT)+1.2, player.position.z);
  raycaster.set(downOrigin, new THREE.Vector3(0,-1,0));
  raycaster.far = Math.max(6, Math.abs(velocityY)*dt + 2);
  const groundHits = raycaster.intersectObjects(collidablesList, false);
  if(groundHits.length>0){
    const groundY = groundHits[0].point.y;
    const currentFeet = player.position.y - EYE_HEIGHT;
    if(currentFeet <= groundY + 0.2 && velocityY<=0){
      player.position.y = groundY + EYE_HEIGHT;
      velocityY = 0;
      grounded = true;
      fallStartY = null;
    } else if (currentFeet > groundY + 0.2) {
      grounded = false;
    }
  } else {
    grounded = false;
    if(fallStartY === null) fallStartY = player.position.y;
    if(fallStartY - player.position.y > LAYER_HEIGHT*3){
      player.position.y = getLayerFromY(player.position.y)*LAYER_HEIGHT + EYE_HEIGHT + 2;
      velocityY = 0;
      fallStartY = null;
    }
  }

  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;

  updateFirstPersonCamera();

  const currentLayer = getLayerFromY(player.position.y);
  document.getElementById('hudLayer').textContent = currentLayer;
  document.getElementById('hudPos').textContent = player.position.x.toFixed(1)+', '+(player.position.y-EYE_HEIGHT).toFixed(1)+', '+player.position.z.toFixed(1);
}

/* ===== INPUT ===== */
let mode = null;
const keys = {};
let pointerLocked = false;

window.addEventListener('keydown', (e)=>{
  keys[e.code] = true;
  if(e.code==='Space'){ wantsJump = true; e.preventDefault(); }
  if(e.code==='KeyQ'){ running = true; }
});
window.addEventListener('keyup', (e)=>{
  keys[e.code] = false;
  if(e.code==='KeyQ'){ running = false; }
});

canvas.addEventListener('click', ()=>{
  if(!pointerLocked && mode==='pc'){ canvas.requestPointerLock(); return; }
  if(pointerLocked){ shoot(); }
});
canvas.addEventListener('contextmenu', (e)=>e.preventDefault());

document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = (document.pointerLockElement === canvas);
});
document.addEventListener('mousemove', (e)=>{
  if(mode!=='pc' || !pointerLocked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI/2+0.02, Math.min(Math.PI/2-0.02, pitch));
});

function pcInputVector(){
  let f=0, s=0;
  if(keys['KeyW']) f+=1;
  if(keys['KeyS']) f-=1;
  if(keys['KeyD']) s+=1;
  if(keys['KeyA']) s-=1;
  return {f,s};
}

/* ===== MOBILE ===== */
const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
const camLookZone = document.getElementById('camLookZone');
const btnJump = document.getElementById('btnJump');
const btnRun = document.getElementById('btnRun');
const btnShoot = document.getElementById('btnShoot');

let joyActive = false, joyId = null, joyVec = {x:0,y:0};
let lookId = null, lookLast = {x:0,y:0};

function joyCenter(){
  const r = joystickZone.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, radius:r.width/2};
}

joystickZone.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyActive = true; joyId = t.identifier;
  updateJoystick(t);
}, {passive:false});
joystickZone.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){ if(t.identifier===joyId) updateJoystick(t); }
}, {passive:false});
function endJoy(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      joyActive=false; joyId=null; joyVec={x:0,y:0};
      joystickKnob.style.left='35px'; joystickKnob.style.top='35px';
    }
  }
}
joystickZone.addEventListener('touchend', endJoy);
joystickZone.addEventListener('touchcancel', endJoy);

function updateJoystick(t){
  const c = joyCenter();
  let dx = t.clientX-c.x, dy = t.clientY-c.y;
  const dist = Math.hypot(dx,dy);
  const max = c.radius;
  if(dist>max){ dx = dx/dist*max; dy = dy/dist*max; }
  joyVec.x = dx/max; joyVec.y = dy/max;
  joystickKnob.style.left = (35+dx)+'px';
  joystickKnob.style.top = (35+dy)+'px';
}

camLookZone.addEventListener('touchstart', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId) continue;
    if(lookId===null){ lookId=t.identifier; lookLast={x:t.clientX,y:t.clientY}; }
  }
}, {passive:true});
camLookZone.addEventListener('touchmove', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier!==lookId) continue;
    const dx = t.clientX-lookLast.x, dy = t.clientY-lookLast.y;
    lookLast = {x:t.clientX,y:t.clientY};
    yaw -= dx*0.0042;
    pitch -= dy*0.0042;
    pitch = Math.max(-Math.PI/2+0.02, Math.min(Math.PI/2-0.02, pitch));
  }
}, {passive:true});
function endLook(e){
  for(const t of e.changedTouches){ if(t.identifier===lookId) lookId=null; }
}
camLookZone.addEventListener('touchend', endLook);
camLookZone.addEventListener('touchcancel', endLook);

btnJump.addEventListener('touchstart', (e)=>{ e.preventDefault(); wantsJump = true; }, {passive:false});

btnRun.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  running = !running;
  btnRun.classList.toggle('active', running);
}, {passive:false});

btnShoot.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  shoot();
}, {passive:false});

function mobileInputVector(){
  return { f: -joyVec.y, s: joyVec.x };
}

/* ===== START ===== */
function beginGame(selectedModeArg){
  mode = selectedModeArg;
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingLabel').textContent='CARREGANDO 0%';
  document.getElementById('loadingBarInner').style.width='0%';
  
  player.position.set(0, EYE_HEIGHT, 0);
  velocityY = 0; fallStartY = null; grounded = true;
  yaw = 0; pitch = 0;
  camera.position.copy(player.position);
  playerHealth = maxHealth;
  isDead = false;
  kills = 0;
  document.getElementById('hudHealth').textContent = playerHealth;
  document.getElementById('hudKills').textContent = kills;
  document.getElementById('deathOverlay').style.display = 'none';
  
  createPlayer();
  createGun();
  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;
  playerGroup.visible = true;

  chunkMap.clear();
  saltMap.clear();
  while(chunkGroup.children.length > 0){
    const child = chunkGroup.children[0];
    chunkGroup.remove(child);
    if(child.geometry) child.geometry.dispose();
    if(child.material) child.material.dispose();
  }
  rebuildCollidables();
  
  for(const m of monsters){ 
    monstersGroup.remove(m.mesh); 
    m.mesh.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(Array.isArray(o.material)) o.material.forEach(mm=>mm.dispose()); else o.material.dispose(); }
    });
  }
  monsters = [];
  
  for(const p of projectiles){
    scene.remove(p.mesh);
    if(p.mesh.geometry) p.mesh.geometry.dispose();
    if(p.mesh.material) p.mesh.material.dispose();
  }
  projectiles = [];
  
  animate();
}

/* ===== LOADING ===== */
const loadingScreen = document.getElementById('loadingScreen');
const loadingLabel = document.getElementById('loadingLabel');
const loadingBarInner = document.getElementById('loadingBarInner');
const hud = document.getElementById('hud');
const crosshair = document.getElementById('crosshair');
const pcHint = document.getElementById('pcHint');
const mobileControls = document.getElementById('mobileControls');

function neededInitialChunkCount(){
  const rC = Math.ceil(INITIAL_RADIUS/CHUNK_SIZE);
  const layerRange = Math.ceil(INITIAL_RADIUS/LAYER_HEIGHT)+1;
  let n=0;
  for(let layer=-layerRange; layer<=layerRange; layer++){
    const layerY=layer*LAYER_HEIGHT;
    for(let cx=-rC; cx<=rC; cx++){
      for(let cz=-rC; cz<=rC; cz++){
        const d = Math.hypot(cx*CHUNK_SIZE+CHUNK_SIZE/2, cz*CHUNK_SIZE+CHUNK_SIZE/2, layerY);
        if(d<=INITIAL_RADIUS) n++;
      }
    }
  }
  return n;
}
const NEEDED_INITIAL = neededInitialChunkCount();

function initialLoadStep(){
  const list = nearestMissingChunks(0,0,0, INITIAL_RADIUS, 0, -1);
  const batch = Math.min(8, list.length);
  for(let i=0;i<batch;i++) requestChunk(list[i].cx, list[i].cz, list[i].layer);
  const loadedInRange = [...chunkMap.values()].filter(c=>{
    const layerY = c.layer*LAYER_HEIGHT;
    const d = Math.hypot(c.cx*CHUNK_SIZE+CHUNK_SIZE/2, c.cz*CHUNK_SIZE+CHUNK_SIZE/2, layerY);
    return d<=INITIAL_RADIUS;
  }).length;
  const pct = Math.min(100, Math.round((loadedInRange/NEEDED_INITIAL)*100));
  loadingBarInner.style.width = pct+'%';
  loadingLabel.textContent = 'CARREGANDO '+pct+'%';
  for(const c of chunkMap.values()){ c.alpha=1; c.mesh.material.opacity=1; c.mesh.scale.y=1; c.state='active'; }
  if(loadedInRange >= NEEDED_INITIAL){
    loadingComplete = true;
    loadingScreen.style.display='none';
    hud.style.display='block';
    crosshair.style.display='block';
    if(mode==='pc'){ pcHint.style.display='block'; }
    if(mode==='mobile'){ mobileControls.style.display='block'; }
  }
}

/* ===== MAIN LOOP ===== */
const clock = new THREE.Clock();
let started = false;

function animate(){
  if(!started){ started = true; clock.start(); }
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.06);

  if(!loadingComplete){ initialLoadStep(); renderer.render(scene, camera); return; }
  if(isDead){ renderer.render(scene, camera); return; }

  if(shootTimer > 0) shootTimer -= dt;

  const inVec = mode==='pc' ? pcInputVector() : mobileInputVector();
  updatePhysics(dt, inVec.f, inVec.s);
  
  updateGun(dt);
  
  _fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));
  updateStreaming(player.position.x, player.position.y, player.position.z, _fwd.x, _fwd.z, 2);
  animateChunks(dt);
  updateMonsters(dt, player.position);
  updateProjectiles(dt);
  
  document.getElementById('hudPos').textContent = player.position.x.toFixed(1)+', '+(player.position.y-EYE_HEIGHT).toFixed(1)+', '+player.position.z.toFixed(1);

  renderer.render(scene, camera);
}

animate();

})();
</script>
