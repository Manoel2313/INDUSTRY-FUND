<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDUSTRY-FUND</title>
    <style>
        /* Reset básico e tela cheia */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Estilo base do HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa o mouse passar para o jogo */
            color: #0ff; /* Ciano neon */
            text-shadow: 0 0 5px #0ff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
        }

        /* Tela de clique inicial (Pointer Lock) */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0ff;
            font-size: 32px;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 0 10px #0ff;
        }

        #overlay span {
            font-size: 16px;
            margin-top: 20px;
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }
    </style>
</head>
<body>

    <!-- Canvas onde o Three.js vai renderizar -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD do Jogo -->
    <div id="hud">
        <div class="hud-top">
            <div id="hud-health">VIDA: 100</div>
            <div id="hud-coins">MOEDAS: 0</div>
        </div>
        <div class="hud-bottom">
            <div id="hud-weapon">ARMA: PÉ DE CABRA</div>
            <div id="hud-ammo">MUNIÇÃO: ∞</div>
        </div>
    </div>

    <!-- Overlay para ativar o Pointer Lock -->
    <div id="overlay">
        CLIQUE PARA INICIAR
        <span>WASD para mover, Mouse para olhar, 1 e 2 para trocar de arma</span>
    </div>

    <!-- Importando o módulo principal do jogo -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
